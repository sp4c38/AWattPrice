services:
  api:
    image: ${AWATTPRICE_IMAGE:-awattprice-backend:v3}
    container_name: awattprice-backend-v3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - gunicorn
      - --workers
      - "1"
      - --access-logfile
      - "-"
      - --access-logformat
      - "%(t)s %(h)s - \"%(r)s\" %(s)s"
      - --bind
      - 0.0.0.0:8000
      - -k
      - uvicorn.workers.UvicornWorker
      - awattprice.api:app
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/data:/etc/awattprice/data"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/logs:/etc/awattprice/logs"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/encryption_key.p8:/etc/awattprice/encryption_key.p8:ro"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/config.ini:/etc/awattprice/config.ini:ro"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/entsoe-token.txt:/etc/awattprice/entsoe-token.txt:ro"

  notifications:
    image: ${AWATTPRICE_IMAGE:-awattprice-backend:v3}
    container_name: awattprice-notifications-v3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - python
      - -m
      - awattprice_notifications.service
    volumes:
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/data:/etc/awattprice/data"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/logs:/etc/awattprice/logs"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/encryption_key.p8:/etc/awattprice/encryption_key.p8:ro"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/config.ini:/etc/awattprice/config.ini:ro"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/entsoe-token.txt:/etc/awattprice/entsoe-token.txt:ro"

  data-refresher:
    image: ${AWATTPRICE_IMAGE:-awattprice-backend:v3}
    container_name: awattprice-data-refresher-v3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - python
      - -m
      - awattprice_refresher.service
    volumes:
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/data:/etc/awattprice/data"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/logs:/etc/awattprice/logs"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/encryption_key.p8:/etc/awattprice/encryption_key.p8:ro"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/config.ini:/etc/awattprice/config.ini:ro"
      - "${AWATTPRICE_HOST_ROOT:-/etc/awattprice-v3}/entsoe-token.txt:/etc/awattprice/entsoe-token.txt:ro"
