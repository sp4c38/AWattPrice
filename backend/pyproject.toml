[project]
name = "awattprice"
version = "2.1.2"
description = "Backend for the AWattPrice iOS app."
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.73.0",
    "python-box>=5.3.0",
    "loguru>=0.6.0",
    "liteconfig>=1.0.0",
    "httpx[http2]>=0.21.3",
    "arrow>=1.2.2",
    "filelock>=3.4.2",
    "aiofile>=3.5.0",
    "jsonschema>=4.4.0",
    "PyJWT>=2.1.0",
    "cryptography>=36.0.1",
    "tenacity>=8.0.1",
    "gunicorn>=20.1.0",
    "uvloop>=0.16.0",
    "uvicorn[standard]>=0.17.0"
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["awattprice", "awattprice_notifications", "awattprice_refresher"]
