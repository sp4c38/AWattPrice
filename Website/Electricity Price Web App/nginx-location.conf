location /prices/ {
        alias /var/www/awattprice/prices/;
        try_files $uri $uri/ /prices/index.html;
    }

# Proxy API requests to the data source
location /api/ {
        proxy_pass https://awattprice.space8.me/;
        proxy_set_header Host awattprice.space8.me;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
